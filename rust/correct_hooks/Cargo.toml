[package]
name = "correct_hooks"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Asymmetric signing, verification, and key management for webhooks"
repository = "https://github.com/pdiffley/correct-hooks"
keywords = ["webhooks", "auth", "asymmetric", "signatures"]
categories = ["authentication"]
exclude = [
  "rustfmt.toml"
]

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = "1.53.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
